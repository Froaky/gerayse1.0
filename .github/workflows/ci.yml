name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Entorno de CI: SQLite por default (sin DATABASE_URL) y DEBUG activo para
      # reflejar el entorno de desarrollo. Los tests corren con "test" en argv,
      # que exime la guarda de SECRET_KEY en config/settings.py.
      DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-insecure-key-not-for-production"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Compile sources
        run: python -m compileall cashops treasury users core config

      - name: Run tests
        run: python manage.py test cashops treasury users core -v 1
